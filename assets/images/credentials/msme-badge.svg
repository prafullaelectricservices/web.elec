<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="msmeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#192A45"/>
    </linearGradient>
    <linearGradient id="msmeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B91C"/>
      <stop offset="100%" stop-color="#FFD666"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="280" rx="16" fill="url(#msmeBg)"/>
  <rect x="1" y="1" width="398" height="278" rx="15" fill="none" stroke="#253C5E" stroke-width="1.5"/>

  <!-- Top Tricolor Stripe Accent -->
  <path d="M 16 2 L 140 2" stroke="#FF9933" stroke-width="3" stroke-linecap="round"/>
  <path d="M 145 2 L 255 2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 260 2 L 384 2" stroke="#138808" stroke-width="3" stroke-linecap="round"/>

  <!-- Icon Circle -->
  <g transform="translate(200, 70)">
    <circle cx="0" cy="0" r="36" fill="#13233A" stroke="#F5B91C" stroke-width="1.5"/>
    <!-- Industrial / Enterprise Cog & Wheat / Growth Emblem -->
    <path d="M -8 -15 L 8 -15 L 10 -8 L 17 -8 L 15 -1 L 22 2 L 20 9 L 24 16 L 17 21 L 12 20 L 8 26 L -8 26 L -12 20 L -17 21 L -24 16 L -20 9 L -22 2 L -15 -1 L -17 -8 L -10 -8 Z" fill="none" stroke="#F5B91C" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="7" fill="url(#msmeGold)"/>
    <path d="M 0 -22 L 0 -16 M 0 26 L 0 32" stroke="#F5B91C" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
    <text x="200" y="135" fill="#94A3B8" font-size="11" font-weight="600" letter-spacing="2">GOVERNMENT OF INDIA</text>
    <text x="200" y="165" fill="#FFFFFF" font-size="24" font-weight="800" letter-spacing="1">MSME</text>
    <text x="200" y="188" fill="#CBD5E1" font-size="12" font-weight="500">Ministry of Micro, Small &amp; Medium Enterprises</text>
    
    <!-- Status Pill -->
    <g transform="translate(200, 225)">
      <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#0D1726" stroke="#F5B91C" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="-90" cy="0" r="4" fill="#22C55E"/>
      <text x="5" y="4" fill="#F5B91C" font-size="11" font-weight="700" letter-spacing="1">CONNECTED / CERTIFIED</text>
    </g>

    <text x="200" y="262" fill="#64748B" font-size="10" font-family="monospace">CERTIFICATE PLACEHOLDER READY</text>
  </g>
</svg>
