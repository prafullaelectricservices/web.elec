<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="engGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#1A2D48"/>
    </linearGradient>
    <linearGradient id="engBoltGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B91C"/>
      <stop offset="100%" stop-color="#FFD666"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="16" fill="url(#engGradBg)"/>
  <rect x="1" y="1" width="398" height="278" rx="15" fill="none" stroke="#253C5E" stroke-width="1.5"/>

  <!-- Top Amber Accent -->
  <path d="M 16 2 L 384 2" stroke="#F5B91C" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Technical Circuit & Compass / Caliper Icon -->
  <g transform="translate(200, 70)">
    <circle cx="0" cy="0" r="36" fill="#13233A" stroke="#F5B91C" stroke-width="1.5"/>
    <!-- Electrical Ohm symbol / Transformer loop -->
    <path d="M -16 12 L -9 12 C -6 7 -6 2 -11 -3 C -14 -7 -12 -16 0 -16 C 12 -16 14 -7 11 -3 C 6 2 6 7 9 12 L 16 12" fill="none" stroke="url(#engBoltGold)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-2" r="3" fill="#F5B91C"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
    <text x="200" y="135" fill="#94A3B8" font-size="11" font-weight="600" letter-spacing="2">FORMAL ACADEMIC &amp; TECHNICAL</text>
    <text x="200" y="162" fill="#FFFFFF" font-size="20" font-weight="800">ELECTRICAL</text>
    <text x="200" y="185" fill="#F5B91C" font-size="16" font-weight="700">ENGINEERING QUALIFIED</text>
    
    <!-- Status Pill -->
    <g transform="translate(200, 225)">
      <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#0D1726" stroke="#F5B91C" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="-90" cy="0" r="4" fill="#22C55E"/>
      <text x="5" y="4" fill="#F5B91C" font-size="11" font-weight="700" letter-spacing="1">VERIFIED QUALIFICATION</text>
    </g>

    <text x="200" y="262" fill="#64748B" font-size="10" font-family="monospace">CERTIFICATE PLACEHOLDER READY</text>
  </g>
</svg>
